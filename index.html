<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notes</title>
    <link rel="stylesheet" href="hark.css" />
    <link rel="stylesheet" href="hark-hero.css" />
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      :root {
        --sans: "Google Sans Flex", "Google Sans", "Product Sans", system-ui, sans-serif;
        --x-bg: light-dark(#f6f6f7, #0e0e10);
        --x-tile: light-dark(#ffffff, #18181b);
        --x-line: light-dark(#ececef, #26262a);
        --x-grey: light-dark(#63636b, #a1a1aa);
        --x-hover: light-dark(#f1f1f3, #232327);
        --x-accent: light-dark(#2563eb, #60a5fa);
        --x-accent-soft: light-dark(#eef3fe, #172235);
        --x-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --x-c-plain: var(--x-tile);
        --x-c-yellow: light-dark(#fdfaf0, #211f19);
        --x-c-green: light-dark(#f2fbf6, #18201b);
        --x-c-blue: light-dark(#f3f7fe, #191e28);
        --x-c-pink: light-dark(#fdf5f8, #221a1f);
        --x-c-purple: light-dark(#f7f5fe, #1e1b27);
      }
      body { background: var(--x-bg); }
      body, button, input, textarea, select, .x-app, .x-app *, .x-toast, .x-toast * { font-family: "Google Sans Flex", "Google Sans", "Product Sans", system-ui, sans-serif; }
      .x-app {
        display: grid;
        grid-template-columns: 64px 360px minmax(0, 1fr);
        gap: 24px;
        height: calc(100dvh - 52px);
        min-height: 520px;
      }
      .x-tile {
        background: var(--x-tile);
        border: 0;
        border-radius: var(--r-l);
        box-shadow: none;
        min-height: 0;
      }
      .x-side { grid-column: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0; background: transparent; --x-rev: 0; }
      .x-side:hover, .x-side:focus-within { --x-rev: 1; }
      .x-side [data-act="export"], .x-side [data-act="import"], .x-side [data-act="theme"] { opacity: var(--x-rev); }
      .x-side .x-ib:not(.is-active)::before { background: var(--x-tile); }
      .x-side .x-gap { flex: 1; }
      .x-ib {
        width: var(--tap); height: var(--tap); flex: none;
        display: inline-grid; place-items: center;
        border: 0; border-radius: 14px; background: transparent; color: var(--x-grey);
        cursor: pointer; transition: transform 0.3s var(--x-spring), opacity 0.2s;
        position: relative;
      }
      .x-ib::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--x-hover); opacity: 0; transition: opacity 0.2s; }
      .x-ib:hover::before { opacity: 1; }
      .x-ib:active { transform: scale(0.9); }
      .x-ib svg { width: 20px; height: 20px; position: relative; }
      .x-ib.is-active { color: var(--x-accent); }
      .x-ib.is-active::before { background: var(--x-accent-soft); opacity: 1; }
      .x-soon svg { opacity: 0.4; }
      .x-soon { cursor: not-allowed; }
      .x-ib--accent { background: var(--x-accent); color: light-dark(#fff, #0e0e10); }
      .x-ib--accent::before { display: none; }
      :root[data-theme="dark"] .x-sun, :root[data-theme="light"] .x-moon { display: none; }

      .x-list { grid-column: 2; display: flex; flex-direction: column; overflow: hidden; background: transparent; }
      .x-lhead { padding: 4px 0 20px; display: grid; gap: 16px; }
      .x-search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; border-radius: var(--r-pill); background: var(--x-tile); color: var(--x-grey); }
      .x-search svg { width: 18px; height: 18px; flex: none; }
      .x-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font: var(--type-body); color: var(--text-primary); }
      .x-search input::placeholder, .x-title::placeholder, .x-tagin::placeholder, .x-body::placeholder { color: var(--x-grey); }
      .x-search .x-kbd { display: none; }
      .x-kbd { font: var(--type-caption); padding: 2px 8px; border-radius: 6px; background: var(--x-hover); }
      .x-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 0 6px; }
      .x-chip {
        display: inline-flex; align-items: center; gap: 4px; min-height: 28px; padding: 0 12px;
        border-radius: var(--r-pill); border: 0; background: var(--x-hover);
        font: var(--type-tag); color: var(--x-grey); cursor: pointer; transition: transform 0.3s var(--x-spring);
      }
      button.x-chip:active { transform: scale(0.94); }
      .x-chip.is-active { color: var(--x-accent); background: var(--x-accent-soft); }
      .x-chip--sm { min-height: 22px; padding: 0; cursor: default; background: transparent; }
      .x-chip--warn { cursor: default; color: var(--text-primary); background: var(--x-tile); }
      .x-chip--warn::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--x-accent); }
      .x-viewname { font: var(--type-heading); }
      .x-cards { flex: 1; overflow-y: auto; padding: 0 0 32px; display: flex; flex-direction: column; gap: 12px; }
      .x-card {
        position: relative; display: grid; gap: 8px; text-align: left; width: 100%;
        padding: 20px 22px; border-radius: var(--r-l); border: 0;
        background: var(--note, var(--x-tile)); color: var(--text-primary); font: var(--type-small); cursor: pointer;
        transition: transform 0.35s var(--x-spring), background-color 0.2s;
      }
      .x-card::before { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 1.5px var(--x-accent); opacity: 0; transition: opacity 0.2s; pointer-events: none; }
      .x-card:hover { background: color-mix(in srgb, var(--note, var(--x-tile)) 97%, var(--text-primary)); }
      .x-card:focus-visible { outline: 2px solid var(--x-accent); outline-offset: 2px; }
      .x-card:active { transform: scale(0.98); }
      .x-card.is-sel::before { opacity: 1; }
      .x-card.is-in { animation: x-in 0.45s var(--ease-out) both; animation-delay: calc(var(--i, 0) * 35ms); }
      .x-card.is-out { transition: transform 0.25s var(--ease-out), opacity 0.25s; transform: scale(0.9); opacity: 0; pointer-events: none; }
      .x-card h3 { font: var(--type-body-strong); display: flex; gap: 8px; align-items: baseline; }
      .x-card h3 span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .x-card h3 svg { width: 14px; height: 14px; color: var(--x-accent); flex: none; align-self: center; }
      .x-snip { color: var(--x-grey); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      .x-meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font: var(--type-caption); color: var(--x-grey); }
      .x-meta time { margin-left: auto; }
      .x-hl { background: color-mix(in srgb, var(--x-accent) 22%, transparent); color: inherit; border-radius: 4px; padding: 0 1px; }
      .x-empty { margin: auto; text-align: center; color: var(--x-grey); font: var(--type-small); padding: 32px 16px; display: grid; gap: 10px; justify-items: center; }
      .x-empty svg { width: 28px; height: 28px; opacity: 0.6; }
      .x-tagrow { display: flex; justify-content: space-between; align-items: center; width: 100%; min-height: 56px; padding: 0 22px; border-radius: var(--r-l); border: 0; background: var(--x-tile); color: var(--text-primary); font: var(--type-label); cursor: pointer; transition: transform 0.3s var(--x-spring); }
      .x-tagrow:active { transform: scale(0.98); }
      .x-tagrow span { color: var(--x-grey); font: var(--type-caption); }

      .x-editor { grid-column: 3; display: flex; flex-direction: column; overflow: hidden; background: var(--note, var(--x-tile)); }
      .x-tools { display: flex; align-items: center; gap: 4px; padding: 16px 20px 0; --x-rev: 0; }
      .x-editor:hover .x-tools, .x-tools:focus-within { --x-rev: 1; }
      .x-tools .x-ib:not(.x-back):not(.is-active), .x-tools .x-swatches { opacity: var(--x-rev); transition: opacity 0.2s, transform 0.3s var(--x-spring); }
      .x-tools .x-gap { flex: 1; }
      .x-back { display: none; }
      .x-saved { display: inline-flex; align-items: center; gap: 4px; font: var(--type-caption); color: var(--x-grey); margin-right: 8px; opacity: 0; transition: opacity 0.3s; }
      .x-saved svg { width: 14px; height: 14px; color: var(--x-accent); }
      .x-saved.is-on { opacity: 1; }
      .x-saved.is-on svg { animation: x-pop 0.45s var(--x-spring); }
      .x-swatches { display: flex; gap: 2px; margin-right: 8px; }
      .x-sw { width: 32px; height: var(--tap); border: 0; background: none; cursor: pointer; display: grid; place-items: center; padding: 0; }
      .x-sw i { width: 18px; height: 18px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text-primary) 14%, transparent); transition: transform 0.3s var(--x-spring); }
      .x-sw:hover i { transform: scale(1.15); }
      .x-sw:active i { transform: scale(0.9); }
      .x-sw.is-active i { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--text-primary) 14%, transparent), 0 0 0 2px var(--note, var(--x-tile)), 0 0 0 3.5px var(--x-accent); }
      .x-ed { flex: 1; overflow-y: auto; padding: 32px clamp(24px, 6vw, 80px) 64px; display: grid; align-content: start; gap: 20px; }
      .x-ed.is-in { animation: x-slide 0.4s var(--ease-out) both; }
      .x-title { border: 0; background: none; outline: none; width: 100%; font: var(--type-title); color: var(--text-primary); padding: 0; }
      .x-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .x-tags .x-chip { cursor: default; padding-right: 2px; background: color-mix(in srgb, var(--text-primary) 5%, transparent); }
      .x-tags .x-chip button { border: 0; background: none; color: inherit; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: var(--type-tag); opacity: 0; transition: opacity 0.2s; }
      .x-tags .x-chip:hover button, .x-tags .x-chip:focus-within button { opacity: 1; }
      .x-tagin { border: 0; background: none; outline: none; font: var(--type-small); color: var(--text-primary); min-width: 90px; height: 28px; }
      .x-body { border: 0; background: none; outline: none; resize: none; width: 100%; min-height: 240px; font: var(--weight-regular) var(--size-prose)/1.6 var(--sans); color: var(--text-primary); padding: 0; overflow: hidden; }
      .x-view { font: var(--weight-regular) var(--size-prose)/1.6 var(--sans); min-height: 240px; cursor: text; }
      .x-view p { min-height: 1.6em; white-space: pre-wrap; overflow-wrap: anywhere; }
      .x-view .x-ph { color: var(--x-grey); }
      .x-todo { display: flex; gap: 10px; align-items: flex-start; }
      .x-todo span { white-space: pre-wrap; overflow-wrap: anywhere; transition: opacity 0.25s; }
      .x-todo.is-done span { text-decoration: line-through; opacity: 0.5; }
      .x-check { flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 7px; border: 1.25px solid var(--x-grey); background: transparent; color: light-dark(#fff, #0e0e10); display: grid; place-items: center; cursor: pointer; padding: 0; position: relative; transition: transform 0.3s var(--x-spring); }
      .x-check::before { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; background: var(--x-accent); opacity: 0; transform: scale(0.6); transition: opacity 0.2s, transform 0.3s var(--x-spring); }
      .x-check svg { width: 14px; height: 14px; position: relative; opacity: 0; transform: scale(0.4); transition: opacity 0.2s, transform 0.35s var(--x-spring); }
      .x-check:active { transform: scale(0.88); }
      .x-check::after { content: ""; position: absolute; inset: -11px; }
      .is-done > .x-check::before, .is-done > .x-check svg { opacity: 1; transform: none; }
      .x-hint { font: var(--type-caption); color: var(--x-grey); }
      .x-media { display: grid; gap: 20px; }
      .x-media:empty { display: none; }
      .x-imgs { display: flex; flex-wrap: wrap; gap: 12px; }
      .x-img { position: relative; margin: 0; }
      .x-img img { display: block; max-width: 100%; max-height: 320px; border-radius: var(--r-m); }
      .x-img button { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: var(--fill-primary); color: var(--text-primary-on); font: var(--type-label); cursor: pointer; opacity: 0.85; }
      .x-img button::after { content: ""; position: absolute; inset: -6px; }
      .x-tscroll { overflow-x: auto; }
      .x-tbl table { border-collapse: collapse; width: 100%; }
      .x-tbl th, .x-tbl td { border: 1px solid var(--stroke-primary); padding: 0; min-width: 96px; }
      .x-tbl th { background: color-mix(in srgb, var(--text-primary) 5%, transparent); }
      .x-tbl input { width: 100%; border: 0; background: none; outline: none; padding: 10px 12px; font: var(--type-body); color: var(--text-primary); }
      .x-tbl th input { font-weight: var(--weight-medium); }
      .x-tbl input:focus { box-shadow: inset 0 0 0 2px var(--x-accent); }
      .x-tbtns { display: flex; flex-wrap: wrap; gap: 2px; font: var(--type-caption); color: var(--x-grey); }
      .x-thumb { display: block; width: 100%; height: 120px; object-fit: cover; border-radius: var(--r-s); }

      .x-fab { display: none; }
      .x-toast {
        position: fixed; left: 50%; bottom: 24px; z-index: 50; display: flex; align-items: center; gap: 14px;
        padding: 6px 6px 6px 18px; border-radius: var(--r-pill); background: var(--fill-primary); color: var(--text-primary-on);
        font: var(--type-label); box-shadow: none; overflow: hidden;
        transform: translate(-50%, 16px) scale(0.96); opacity: 0; pointer-events: none;
        transition: transform 0.4s var(--x-spring), opacity 0.25s;
      }
      .x-toast.is-on { transform: translate(-50%, 0); opacity: 1; pointer-events: auto; }
      .x-toast button { min-height: 48px; min-width: 48px; padding: 0 14px; border: 0; border-radius: var(--r-pill); background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; font: var(--type-label); cursor: pointer; }
      .x-toast button[hidden] { display: none; }
      .x-toast::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--x-accent); transform-origin: left; transform: scaleX(0); }
      .x-toast.is-timed::after { animation: x-bar 5s linear both; }
      .x-toast:not([data-undo]) { padding-right: 18px; min-height: 48px; }

      .x-dash { grid-column: 2 / -1; min-height: 0; overflow-y: auto; padding: 4px 0 32px; display: grid; align-content: start; gap: 24px; }
      .x-dash[hidden], .x-app.is-dash .x-list, .x-app.is-dash .x-editor { display: none; }
      .x-dhead { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 8px 0; }
      .x-dhead h2 { font: var(--type-title); }
      .x-bento { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
      .x-dt { padding: 28px 30px; display: grid; align-content: start; gap: 10px; transition: transform 0.4s var(--x-spring); }
      .x-dt.is-in { animation: x-in 0.5s var(--ease-out) backwards; animation-delay: calc(var(--i, 0) * 70ms); }
      .x-dt--2 { grid-column: span 2; }
      .x-dt--4 { grid-column: 1 / -1; }
      .x-dl { font: var(--type-small); color: var(--x-grey); display: flex; justify-content: space-between; gap: 8px; }
      .x-fig { font: var(--weight-medium) 56px/1 var(--sans); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
      .x-dt--total .x-fig { color: var(--x-accent); }
      .x-bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 12px; height: 160px; margin-top: 10px; }
      .x-bar { display: grid; grid-template-rows: auto 1fr auto; gap: 6px; text-align: center; font: var(--type-caption); color: var(--x-grey); min-height: 0; }
      .x-bar b { display: flex; align-items: flex-end; justify-content: center; min-height: 0; }
      .x-bar i { width: min(100%, 24px); height: max(4px, calc(var(--h) * 1%)); border-radius: 8px; background: light-dark(#e6e6ea, #2c2c31); transform-origin: bottom; }
      .x-bar.is-today i { background: var(--x-accent); }
      .x-bar.is-today { color: var(--text-primary); }
      .x-dt.is-in .x-bar i { animation: x-grow 0.7s var(--x-spring) backwards; animation-delay: calc(250ms + var(--j) * 55ms); }
      .x-recent { --x-c-plain: var(--x-bg); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; margin-top: 8px; }
      .x-mini { display: grid; gap: 6px; align-content: start; text-align: left; min-height: 104px; padding: 18px 20px; border-radius: var(--r-m); border: 0; background: var(--note, var(--x-bg)); color: var(--text-primary); font: var(--type-small); cursor: pointer; transition: transform 0.35s var(--x-spring), background-color 0.2s; }
      .x-mini:hover { background: color-mix(in srgb, var(--note, var(--x-bg)) 96%, var(--text-primary)); }
      .x-mini:active { transform: scale(0.97); }
      .x-mini strong { font: var(--type-label); overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
      @media (max-width: 1100px) { .x-recent { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
      .x-mini span { color: var(--x-grey); font: var(--type-caption); }
      .x-cloud { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
      .x-cloud .x-chip { min-height: 36px; padding: 0 14px; }
      .x-cloud .x-chip:hover { color: var(--x-accent); background: var(--x-accent-soft); }
      .x-cloud .x-chip span { opacity: 0.7; }
      .x-foot { display: grid; gap: 16px; padding-top: 8px; }
      .x-flinks { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 4px; font: var(--type-caption); color: var(--x-grey); }
      .x-flink { border: 0; background: none; color: inherit; font: inherit; min-height: var(--tap); padding: 0 10px; cursor: pointer; border-radius: var(--r-s); }
      .x-flink:hover, .x-flink.is-active { color: var(--text-primary); }
      .x-art { height: 140px; border-radius: var(--r-l); border: 0; background: linear-gradient(120deg, var(--x-accent-soft), var(--x-tile)); }
      @keyframes x-grow { from { transform: scaleY(0); } }
      @keyframes x-in { from { opacity: 0; transform: translateY(10px) scale(0.98); } }
      @keyframes x-slide { from { opacity: 0; transform: translateX(14px); } }
      @keyframes x-pop { 0% { transform: scale(0.4); } 100% { transform: none; } }
      @keyframes x-bar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

      @media (max-width: 760px) {
        .x-app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 16px; overflow: hidden; height: calc(100dvh - 24px); border-radius: var(--r-l); }
        .x-side { grid-column: 1; grid-row: 1; flex-direction: row; padding: 0; overflow-x: auto; }
        .x-tools { padding: 12px 12px 0; }
        .x-ed { padding: 24px 22px 56px; }
        .x-dt { padding: 22px 22px; }
        .x-fig { font-size: 44px; }
        .x-side .x-new { display: none; }
        .x-list, .x-editor { grid-column: 1; grid-row: 2; transition: transform 0.45s var(--ease-out), opacity 0.3s; }
        .x-editor { transform: translateX(calc(100% + 24px)); pointer-events: none; visibility: hidden; transition: transform 0.45s var(--ease-out), visibility 0s 0.45s; }
        .x-app.is-editing .x-editor { transform: none; pointer-events: auto; visibility: visible; transition: transform 0.45s var(--ease-out); }
        .x-app.is-editing .x-list { transform: translateX(-24%); opacity: 0; pointer-events: none; }
        .x-back { display: inline-grid; }
        .x-tools { flex-wrap: wrap; }
        .x-swatches { order: 10; width: 100%; justify-content: space-between; margin: 0; }
        .x-swatches .x-sw { width: 48px; height: 48px; flex: none; }
        .x-tools .x-ib { width: 48px; height: 48px; }
        .x-fab { display: grid; position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; z-index: 40; box-shadow: none; transition: transform 0.35s var(--x-spring), opacity 0.25s; }
        .x-fab:active { transform: scale(0.9); }
        .x-app.is-editing ~ .x-fab { opacity: 0; pointer-events: none; visibility: hidden; transition: opacity 0.25s, visibility 0s 0.25s; }
        .x-toast { bottom: 88px; }
        .x-dash { grid-column: 1; grid-row: 2; padding: 2px 2px 96px; }
        .x-bento, .x-recent { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .x-dt--2 { grid-column: 1 / -1; }
      }
      @media (hover: none) {
        .x-side, .x-tools { --x-rev: 1; }
        .x-tags .x-chip button { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .x-app *, .x-app *::before, .x-app *::after, .x-toast, .x-toast::after, .x-fab { animation-duration: 0.01ms !important; animation-delay: 0ms !important; transition-duration: 0.01ms !important; transition-delay: 0ms !important; }
        .x-card:hover, .x-tagrow:hover { transform: none; }
        .x-ai, .x-ai * { transition-duration: 0.01ms !important; }
      }
      /* assistant panel + text enhancer */

    <script>
      /* ---------- store: localStorage with an in-memory fallback ---------- */
      var store = (function () {
        var KEY = "notes-app.v1", mem = [], ok = true, subs = [], fresh = false;
        try {
          localStorage.setItem("__notes_t", "1");
          localStorage.removeItem("__notes_t");
          var raw = localStorage.getItem(KEY);
          if (raw === null) fresh = true; else mem = JSON.parse(raw) || [];
        } catch (e) { ok = false; fresh = true; }
        function persist() {
          if (!ok) return;
          try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) { ok = false; }
        }
        function emit(why) { subs.forEach(function (fn) { fn(why); }); }
        return {
          isFresh: function () { return fresh; },
          persistent: function () { return ok; },
          getNotes: function () { return mem.map(function (n) { return Object.assign({}, n, { tags: (n.tags || []).slice() }); }); },
          getNote: function (id) { var n = mem.find(function (x) { return x.id === id; }); return n ? Object.assign({}, n, { tags: n.tags.slice() }) : null; },
          saveNote: function (note, why) {
            var i = mem.findIndex(function (x) { return x.id === note.id; });
            var copy = Object.assign({}, note, { tags: (note.tags || []).slice() });
            if (i < 0) mem.push(copy); else mem[i] = copy;
            persist(); emit(why || "save");
          },
          deleteNote: function (id) { mem = mem.filter(function (x) { return x.id !== id; }); persist(); emit("delete"); },
          replaceAll: function (list) { mem = list; persist(); emit("import"); },
          subscribe: function (fn) { subs.push(fn); return function () { subs = subs.filter(function (f) { return f !== fn; }); }; }
        };
      })();

      /* ---------- helpers ---------- */
      var $ = function (s, r) { return (r || document).querySelector(s); };
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
      var mobile = window.matchMedia("(max-width: 760px)");
      var COLORS = [["plain", "Plain"], ["yellow", "Butter"], ["green", "Mint"], ["blue", "Sky"], ["pink", "Rose"], ["purple", "Lilac"]];
      var TODO = /^(\s*(?:- )?)\[( |x|X)\]\s?(.*)$/;
      var ICON = {
        pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 4 4H6l4-4-1-6zM12 14v7"/></svg>',
        check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
        back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
        archive: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="2"/><path d="M5 9v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V9M10 13h4"/></svg>',
        trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
        list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="6" height="6" rx="1.5"/><path d="M4.5 7l1.2 1.2L8 6M13 7h8M3 16h6M13 16h8"/></svg>',
        note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="4"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
        image: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.5"/><path d="M21 16l-5-5-9 9"/></svg>',
        table: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 15h18M9 4v16M15 4v16"/></svg>'
      };
      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
      function hl(s) {
        var out = esc(s);
        if (!state.q) return out;
        var re = new RegExp(esc(state.q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
        return out.replace(re, function (m) { return '<mark class="x-hl">' + m + "</mark>"; });
      }
      function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
      function when(t) {
        var d = Date.now() - t;
        if (d < 60000) return "now";
        if (d < 3600000) return Math.floor(d / 60000) + "m";
        if (d < 86400000) return Math.floor(d / 3600000) + "h";
        return new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
      }
      function todos(body) {
        var t = 0, d = 0;
        body.split("\n").forEach(function (l) { var m = l.match(TODO); if (m) { t++; if (m[2] !== " ") d++; } });
        return { t: t, d: d };
      }

      /* ---------- seed ---------- */
      if (store.isFresh()) {
        var now = Date.now();
        [
          { title: "Welcome to Notes", body: "Write anything. Lines starting with [ ] become a checklist.\n[x] Create a note with Ctrl+N\n[ ] Search with Ctrl+K\n[ ] Pin this note", tags: ["start"], color: "blue", pinned: true },
          { title: "Weekend groceries", body: "[ ] Oat milk\n[ ] Lemons\n[x] Coffee beans\n[ ] Basil", tags: ["home"], color: "green" },
          { title: "Ideas", body: "A quiet morning routine.\nRead more on paper.", tags: ["personal"], color: "yellow" }
        ].forEach(function (n, i) {
          store.saveNote(Object.assign({ id: uid() + i, archived: false, pinned: false, created: now - i * 3600000, updated: now - i * 3600000 }, n), "seed");
        });
      }

      /* ---------- state and elements ---------- */
      var state = { view: "notes", tag: null, q: "", sel: null };
      var app = $("#app"), cardsEl = $("#cards"), chipsEl = $("#chips"), editor = $("#editor"), qIn = $("#q");
      var saveTimer = null, toastTimer = null, undoFn = null, lastView = null;

      function visible() {
        var q = state.q.toLowerCase();
        return store.getNotes().filter(function (n) {
          if (state.view === "archive" ? !n.archived : n.archived) return false;
          if (state.view === "pinned" && !n.pinned) return false;
          if (state.tag && n.tags.indexOf(state.tag) < 0) return false;
          if (q && (n.title + "\n" + n.body + "\n" + n.tags.join(" ")).toLowerCase().indexOf(q) < 0) return false;
          return true;
        }).sort(function (a, b) { return (b.pinned - a.pinned) || (b.updated - a.updated); });
      }
      function allTags() {
        var c = {};
        store.getNotes().forEach(function (n) { if (!n.archived) n.tags.forEach(function (t) { c[t] = (c[t] || 0) + 1; }); });
        return Object.keys(c).sort().map(function (t) { return [t, c[t]]; });
      }

      /* ---------- list ---------- */
      function snippet(n) {
        var text = n.body.split("\n").map(function (l) { var m = l.match(TODO); return m ? (m[2] === " " ? "○ " : "✓ ") + m[3] : l; }).join("  ").trim();
        var i = state.q ? text.toLowerCase().indexOf(state.q.toLowerCase()) : -1;
        if (i > 50) text = "…" + text.slice(i - 30);
        return text.slice(0, 180);
      }
      function renderChips() {
        var names = { notes: "Notes", pinned: "Pinned", archive: "Archive", tags: "Tags", dashboard: "Dashboard" };
        var h = '<span class="x-viewname">' + names[state.view] + "</span>";
        if (state.tag) h += '<button class="x-chip is-active" data-clear-tag title="Clear tag filter">#' + esc(state.tag) + " ×</button>";
        chipsEl.innerHTML = h;
      }
      function renderList() {
        renderChips();
        var animate = !reduce.matches;
        var old = {};
        cardsEl.querySelectorAll(".x-card").forEach(function (el) { old[el.dataset.id] = el.getBoundingClientRect(); });
        var viewChanged = lastView !== state.view + "|" + state.tag;
        lastView = state.view + "|" + state.tag;

        if (state.view === "tags" && !state.q) {
          var tags = allTags();
          cardsEl.innerHTML = tags.length
            ? tags.map(function (t, i) { return '<button class="x-tagrow x-card is-in" style="--i:' + i + '" data-tag="' + esc(t[0]) + '">#' + esc(t[0]) + "<span>" + t[1] + "</span></button>"; }).join("")
            : '<div class="x-empty">' + ICON.note + "No tags yet</div>";
          return;
        }
        var list = visible();
        if (!list.length) {
          cardsEl.innerHTML = '<div class="x-empty">' + ICON.note + (state.q ? "No matches" : state.view === "archive" ? "Nothing archived" : state.view === "pinned" ? "No pinned notes" : "No notes yet") + "</div>";
          return;
        }
        cardsEl.innerHTML = list.map(function (n, i) {
          var td = todos(n.body);
          var meta = n.tags.map(function (t) { return '<span class="x-chip x-chip--sm">#' + hl(t) + "</span>"; }).join("");
          if (td.t) meta += '<span class="x-chip x-chip--sm">' + td.d + "/" + td.t + "</span>";
          if (n.tables && n.tables.length) meta += '<span class="x-chip x-chip--sm">▦ table</span>';
          var isNew = viewChanged || !old[n.id];
          return '<button class="x-card' + (n.id === state.sel ? " is-sel" : "") + (isNew && animate ? " is-in" : "") + '" data-id="' + n.id + '" style="--note:var(--x-c-' + n.color + ");--i:" + (viewChanged ? Math.min(i, 12) : 0) + '">' +
            "<h3><span>" + (n.title ? hl(n.title) : '<span class="x-hint">Untitled</span>') + "</span>" + (n.pinned ? ICON.pin : "") + "</h3>" +
            (n.images && n.images[0] ? '<img class="x-thumb" src="' + n.images[0] + '" alt="" />' : "") +
            (n.body.trim() ? '<p class="x-snip">' + hl(snippet(n)) + "</p>" : "") +
            '<div class="x-meta">' + meta + "<time>" + when(n.updated) + "</time></div></button>";
        }).join("");
        if (!animate || viewChanged) return;
        cardsEl.querySelectorAll(".x-card").forEach(function (el) {
          var o = old[el.dataset.id];
          if (!o) return;
          var r = el.getBoundingClientRect(), dx = o.left - r.left, dy = o.top - r.top;
          if (!dx && !dy) return;
          el.style.transition = "none";
          el.style.transform = "translate(" + dx + "px," + dy + "px)";
          el.getBoundingClientRect();
          requestAnimationFrame(function () {
            el.style.transition = "transform .5s var(--x-spring)";
            el.style.transform = "";
            el.addEventListener("transitionend", function () { el.style.transition = ""; }, { once: true });
          });
        });
      }

      /* ---------- dashboard ---------- */
      var dashEl = $("#dash"), bento = $("#bento"), dashPrev = {};
      function countUp(el) {
        var k = el.dataset.k, to = +el.dataset.v, from = dashPrev[k] || 0;
        dashPrev[k] = to;
        if (reduce.matches || from === to) { el.textContent = to; return; }
        var t0 = performance.now();
        el.textContent = from;
        requestAnimationFrame(function step(t) {
          var p = Math.min(1, (t - t0) / 800), e = 1 - Math.pow(1 - p, 3);
          el.textContent = Math.round(from + (to - from) * e);
          if (p < 1) requestAnimationFrame(step);
        });
      }
      function renderDash(enter) {
        if (enter) dashPrev = {};
        var all = store.getNotes(), live = all.filter(function (n) { return !n.archived; });
        var d = new Date(), days = [];
        for (var i = 6; i >= 0; i--) {
          var s = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i).getTime(), e = new Date(d.getFullYear(), d.getMonth(), d.getDate() - i + 1).getTime();
          days.push({ s: s, e: e, c: 0, name: new Date(s).toLocaleDateString(undefined, { weekday: "short" }) });
        }
        var week = 0;
        all.forEach(function (n) { days.forEach(function (x) { if (n.updated >= x.s && n.updated < x.e) { x.c++; week++; } }); });
        var max = Math.max(1, Math.max.apply(null, days.map(function (x) { return x.c; })));
        var pinned = live.filter(function (n) { return n.pinned; }).length;
        var recent = live.slice().sort(function (a, b) { return b.updated - a.updated; }).slice(0, 4);
        var tags = allTags(), cls = enter && !reduce.matches ? " is-in" : "";
        function tile(i, mod, inner) { return '<div class="x-tile x-dt' + mod + cls + '" style="--i:' + i + '">' + inner + "</div>"; }
        function fig(k, v) { return '<span class="x-fig" data-k="' + k + '" data-v="' + v + '">' + (dashPrev[k] || 0) + "</span>"; }
        bento.innerHTML =
          tile(0, " x-dt--2 x-dt--total", '<span class="x-dl">Notes</span>' + fig("total", all.length) + '<span class="x-hint">' + live.length + " active · " + (all.length - live.length) + " archived</span>") +
          tile(1, "", '<span class="x-dl">Pinned</span>' + fig("pinned", pinned)) +
